  <!-- main center -->
  <rect x="305" y="202" width="920" height="430" rx="12" fill="url(#hero)" stroke="#315a9a"/>
  <rect x="305" y="202" width="920" height="430" rx="12" fill="url(#grid)" opacity=".55"/>
  <text x="342" y="242" class="small">GOOD MORNING</text>
  <text x="342" y="287" class="h1">Explore a More</text>
  <text x="342" y="327" class="h1">Open Tomorrow</text>
  <text x="342" y="353" class="body">Fast. Thoughtful. Yours. Built around an independent Rust browser core.</text>

