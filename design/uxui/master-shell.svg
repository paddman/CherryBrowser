    <text x="690" y="142" class="label">✓ Secure DNS / local controls</text>
    <rect x="612" y="158" width="255" height="24" rx="6" fill="#1b5fc3"/><text x="676" y="175" class="small" fill="#fff">VIEW DETAILS</text>

    <rect x="901" y="0" width="319" height="193" rx="12" class="panel"/>
    <text x="919" y="30" class="h2">Customize Your Experience</text>
