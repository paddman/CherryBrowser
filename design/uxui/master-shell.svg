  <text x="1262" y="232" class="h2">Meet Cherry  •</text>
  <text x="1262" y="251" class="small">Your AI browsing companion</text>
  <rect x="1260" y="270" width="245" height="150" rx="12" fill="url(#hero)" stroke="#315a9a"/>
  <circle cx="1370" cy="330" r="48" fill="#1a56a8" stroke="#65c6ff" stroke-width="2" filter="url(#glow)"/>
  <path d="M1332 316 Q1370 270 1408 316 Q1390 298 1370 301 Q1350 298 1332 316Z" fill="#2f7cff"/>
  <circle cx="1352" cy="332" r="6" fill="#bfe6ff"/><circle cx="1388" cy="332" r="6" fill="#bfe6ff"/>
  <path d="M1356 353 Q1370 363 1384 353" fill="none" stroke="#eaf6ff" stroke-width="3" stroke-linecap="round"/>
  <text x="1262" y="448" class="small">How can I help you today?</text>
