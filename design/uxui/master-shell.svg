    <rect x="16" y="155" width="253" height="25" rx="6" fill="#10264a"/><text x="26" y="172" class="small">+ New Research Tab</text>

    <rect x="297" y="0" width="285" height="193" rx="12" class="panel"/>
    <text x="315" y="30" class="h2">Saved Notes & Snippets</text>
    <text x="315" y="59" class="small">Reusable research summaries</text>
    <line x1="315" y1="72" x2="562" y2="72" stroke="#25477e"/>
    <text x="315" y="97" class="label">• Space tech key takeaways</text>
    <text x="315" y="124" class="label">• Global collaboration insights</text>
    <text x="315" y="151" class="label">• Product design references</text>
    <text x="315" y="177" class="small">+ Add a new snippet…</text>

    <rect x="594" y="0" width="295" height="193" rx="12" class="panel"/>
    <text x="612" y="30" class="h2">Security & Privacy Insights</text>
    <text x="612" y="58" class="small">Your browsing, your control.</text>
    <circle cx="645" cy="111" r="29" fill="#0f2b53" stroke="#40e2ff" stroke-width="4"/>
    <text x="632" y="118" class="h2">100</text>
    <text x="690" y="92" class="label">✓ Tracking protection active</text>
