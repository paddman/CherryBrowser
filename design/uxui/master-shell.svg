    <rect x="919" y="76" width="63" height="44" rx="6" fill="#0a2c62" stroke="#3d96ff"/>
    <rect x="991" y="76" width="63" height="44" rx="6" fill="#261048" stroke="#8e57ff"/>
    <rect x="1063" y="76" width="63" height="44" rx="6" fill="#060912" stroke="#24395f"/>
    <rect x="1135" y="76" width="63" height="44" rx="6" fill="#dde7f7" stroke="#9cb9e7"/>
