  </g>

  <!-- left rail -->
  <rect x="75" y="202" width="215" height="640" rx="12" class="panel"/>
  <text x="98" y="235" class="h2">CHERRYBROWSER</text>
  <g class="label">
    <rect x="90" y="252" width="185" height="36" rx="8" fill="#1b5fc3"/>
    <text x="112" y="275" class="active">New Tab</text>
    <text x="112" y="317">AI Assistant</text>
    <text x="112" y="357">Workspaces</text>
    <text x="112" y="397">Bookmarks</text>
    <text x="112" y="437">History</text>
    <text x="112" y="477">Downloads</text>
    <text x="112" y="517">Security Insights</text>
