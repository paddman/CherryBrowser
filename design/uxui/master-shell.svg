    <text x="73" y="49" class="micro">A MORE OPEN TOMORROW</text>
  </g>
  <text x="610" y="57" class="body" fill="#6fb9ff">BROWSE  ·  CREATE  ·  RESEARCH  ·  CONNECT</text>
  <text x="1310" y="50" class="micro">FASTER · SMARTER · MORE YOURS</text>

  <!-- outer application -->
  <rect x="55" y="92" width="1490" height="770" rx="18" fill="#040b1b" stroke="#4c8cff" stroke-width="2"/>
  <rect x="55" y="92" width="1490" height="54" rx="18" fill="#071127"/>

  <!-- tabs -->
  <g>
    <rect x="84" y="104" width="178" height="32" rx="8" fill="#153971" stroke="#4aa4ff"/>
