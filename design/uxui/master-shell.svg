  <rect x="390" y="374" width="650" height="58" rx="29" fill="#0b1730" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="425" cy="403" r="10" fill="none" stroke="#8fcaff" stroke-width="2"/>
  <line x1="433" y1="411" x2="442" y2="420" stroke="#8fcaff" stroke-width="2"/>
  <text x="460" y="408" class="body">Search the web privately…</text>
  <circle cx="1004" cy="403" r="20" fill="#277cff"/>
  <text x="996" y="410" class="h2">›</text>

  <!-- shortcuts -->
  <g>
    <rect x="350" y="545" width="120" height="64" rx="10" class="panel2"/>
    <rect x="482" y="545" width="120" height="64" rx="10" class="panel2"/>
    <rect x="614" y="545" width="120" height="64" rx="10" class="panel2"/>
    <rect x="746" y="545" width="120" height="64" rx="10" class="panel2"/>
    <rect x="878" y="545" width="120" height="64" rx="10" class="panel2"/>
    <rect x="1010" y="545" width="120" height="64" rx="10" class="panel2"/>
    <text x="386" y="583" class="label">YouTube</text><text x="521" y="583" class="label">GitHub</text>
    <text x="651" y="583" class="label">Notion</text><text x="784" y="583" class="label">Figma</text>
    <text x="930" y="583" class="label">X</text><text x="1047" y="583" class="label">+ Add</text>
