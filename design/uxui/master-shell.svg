  <g opacity=".95" fill="#0c2a5d" stroke="#3b86db" stroke-width="1">
    <rect x="337" y="414" width="40" height="112"/><rect x="386" y="388" width="34" height="138"/>
    <rect x="430" y="438" width="46" height="88"/><rect x="490" y="370" width="31" height="156"/>
    <rect x="540" y="405" width="42" height="121"/><rect x="596" y="350" width="34" height="176"/>
