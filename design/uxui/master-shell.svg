<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030817"/>
      <stop offset="0.58" stop-color="#07152f"/>
      <stop offset="1" stop-color="#13082d"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172d"/>
      <stop offset="0.55" stop-color="#0b2550"/>
      <stop offset="1" stop-color="#241157"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d96ff"/>
      <stop offset="0.55" stop-color="#40e2ff"/>
      <stop offset="1" stop-color="#8e57ff"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#3d96ff" stroke-opacity=".08"/>
    </pattern>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#e7f2ff;letter-spacing:.5px}
      .h1{font:700 38px Arial,sans-serif;fill:#f5f9ff}
      .h2{font:700 18px Arial,sans-serif;fill:#e9f2ff}
      .body{font:400 14px Arial,sans-serif;fill:#9fb3d5}
      .small{font:400 12px Arial,sans-serif;fill:#8397bb}
      .micro{font:600 10px Arial,sans-serif;fill:#6f88b2;letter-spacing:1.6px}
      .label{font:600 13px Arial,sans-serif;fill:#cfe0ff}
      .active{font:700 13px Arial,sans-serif;fill:#ffffff}
      .panel{fill:#081125;stroke:#25477e;stroke-width:1}
      .panel2{fill:#0d1831;stroke:#315a9a;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- decorative skyline -->
  <g opacity=".42">
    <rect x="0" y="98" width="1600" height="122" fill="#031024"/>
    <g fill="#0b2450" stroke="#235ca5" stroke-width="1">
      <rect x="30" y="145" width="38" height="75"/><rect x="76" y="120" width="32" height="100"/>
      <rect x="120" y="154" width="48" height="66"/><rect x="178" y="104" width="30" height="116"/>
      <rect x="218" y="132" width="48" height="88"/><rect x="280" y="94" width="28" height="126"/>
      <rect x="322" y="149" width="54" height="71"/><rect x="392" y="116" width="34" height="104"/>
      <rect x="447" y="83" width="30" height="137"/><rect x="492" y="138" width="42" height="82"/>
      <rect x="548" y="101" width="33" height="119"/><rect x="598" y="152" width="47" height="68"/>
      <rect x="663" y="120" width="28" height="100"/><rect x="708" y="89" width="34" height="131"/>
      <rect x="758" y="139" width="50" height="81"/><rect x="820" y="109" width="29" height="111"/>
      <rect x="870" y="148" width="43" height="72"/><rect x="930" y="78" width="33" height="142"/>
      <rect x="978" y="127" width="48" height="93"/><rect x="1042" y="92" width="31" height="128"/>
      <rect x="1090" y="142" width="44" height="78"/><rect x="1150" y="106" width="34" height="114"/>
      <rect x="1200" y="82" width="30" height="138"/><rect x="1246" y="147" width="50" height="73"/>
      <rect x="1312" y="119" width="36" height="101"/><rect x="1368" y="94" width="28" height="126"/>
      <rect x="1410" y="139" width="48" height="81"/><rect x="1472" y="110" width="34" height="110"/>
      <rect x="1518" y="151" width="44" height="69"/>
    </g>
  </g>

  <!-- brand header -->
  <g transform="translate(40 26)">
    <path d="M0 24 L22 2 L54 2 L32 20 L54 40 L22 40 Z" fill="none" stroke="#58b4ff" stroke-width="5" filter="url(#glow)"/>
