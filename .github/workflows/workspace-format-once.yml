# Temporary branch-only formatter. Removed before this UX pull request is ready.
name: Workspace branch formatting

on:
  push:
    branches: [feat/usable-workspace-ux]
    paths:
      - 'src/**'
      - '.github/workflows/workspace-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'paddman/CherryBrowser' && github.ref == 'refs/heads/feat/usable-workspace-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format only Rust sources on this review branch
        run: |
          cargo fmt --all
          if git diff --quiet -- src; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'style: format the native workspace UX'
          git push origin HEAD:refs/heads/feat/usable-workspace-ux
