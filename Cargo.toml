[package]
name = "cherry-browser"
version = "0.1.0"
edition = "2024"
description = "CherryBrowser: an independent browser and rendering engine written in Rust"
repository = "https://github.com/paddman/CherryBrowser"
publish = false

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "0.13.5", features = ["blocking", "gzip", "brotli", "deflate", "zstd"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
